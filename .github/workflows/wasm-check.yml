name: WASM check
on:
  pull_request:
  push:
    branches: [main]
jobs:
  ladder:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: SIMD SoA lerp
        run: node test/ladder-wasm.mjs
      - name: Torus bake gates
        run: node test/torus-bake.mjs
      - name: Bake quality self-test
        run: python3 tools/bake_quad.py --self-test
